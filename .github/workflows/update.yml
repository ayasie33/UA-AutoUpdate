name: Update user agents

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat user-agents.json
        run: python scripts/update.py

      - name: Commit jika ada perubahan
        run: |
          git config user.name "ua-bot"
          git config user.email "ua-bot@users.noreply.github.com"
          git add user-agents.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Update user agents"
            git push
          fi
